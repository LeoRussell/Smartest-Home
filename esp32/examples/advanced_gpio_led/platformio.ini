[platformio]
default_envs = esp32-s3-devkitc-1
src_dir = src
include_dir = ../../include
lib_dir = ../../lib

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    links2004/WebSockets
    bblanchon/ArduinoJson
build_flags =
    -DLED_PIN=48
