; ESP32-S3 board profiles. The default drives a plain LED directly on GPIO 48.
[platformio]
default_envs = esp32-s3-devkitc-1
lib_dir = ../../shared/lib

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags =
    -I../../shared/include
lib_deps =
    links2004/WebSockets
    bblanchon/ArduinoJson

; The connected LED on GPIO 48 is controlled as a regular digital output.
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDEVICE_LED_DRIVER=0
    -DLED_PIN=48

; Alternative for the stock addressable RGB LED on DevKitC-1 v1.0.
[env:esp32-s3-devkitc-1-v1_0-neopixel]
board = esp32-s3-devkitc-1
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit NeoPixel
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDEVICE_LED_DRIVER=1
    -DLED_PIN=48

; DevKitC-1 v1.1 moved the addressable RGB indicator to GPIO 38.
[env:esp32-s3-devkitc-1-v1_1]
board = esp32-s3-devkitc-1
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit NeoPixel
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDEVICE_LED_DRIVER=1
    -DLED_PIN=38

; Adafruit Feather ESP32-S3 uses a simple red LED on GPIO 13.
[env:adafruit_feather_esp32s3]
board = adafruit_feather_esp32s3
build_flags =
    ${env.build_flags}
    -DDEVICE_LED_DRIVER=0
    -DLED_PIN=13
