<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Gateway</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <div class="brand-mark" aria-hidden="true">SH</div>
            <div>
                <p class="eyebrow">SMART HOME · LOCAL GATEWAY</p>
                <h1>IoT Gateway</h1>
                <p>Управление устройствами и состоянием системы</p>
            </div>
        </div>
        <div class="server-status" role="status" aria-live="polite">
            <span class="status-dot" id="gateway-status-dot"></span>
            <span id="gateway-status">Нет соединения с Gateway</span>
        </div>
    </header>

    <main>
        <section class="section-heading">
            <div>
                <h2>Устройства</h2>
                <p>Состояние и доступные действия</p>
            </div>
            <button id="refresh-button">Обновить</button>
        </section>

        <section id="dashboard-overview" class="dashboard-overview" aria-label="Сводка устройств"></section>

        <section class="device-card" aria-live="polite"></section>

        <section class="activity-card">
            <h2>События</h2>
            <p id="activity-message">
                Подключаемся к Gateway...
            </p>
        </section>
    </main>

    <footer>
        IoT Gateway · Локальная сеть
    </footer>
    <script src="app.js"></script>
</body>
</html>
